            generation_source:
              type: string
              enum: [ai, manual]
            role:
              type: string
            appearance:
              type: string
            hairstyle:
              type: string
            outfit:
              type: string
            signature_traits:
              type: array
              items:
                type: string
            personality:
              type: string
            visual_traits:
              type: array
              items:
                type: string
            image_prompt:
              type: string
        reference_asset_id:
          type: [string, 'null']
          format: uuid
        reference_locked:
          type: boolean
          description: When true, character draft regeneration must keep the reference image
          default: false
        status:
          type: string
          enum: [draft, in_review, approved]
        version:
          type: integer
          minimum: 1
    SceneGenerationRequest:
      type: object
      additionalProperties: false
      properties:
        episode_id:
          type: [string, 'null']
          format: uuid
        guidance:
          type: string
          maxLength: 4000
        scene_ids:
          type: array
          description: When non-empty, only these scenes are regenerated.
          items:
            type: string
            format: uuid
        image_only:
          type: boolean
          description: Skip text generation and only render reference images.
          default: false
        text_only:
          type: boolean
          description: Skip reference images and only regenerate text profiles.
          default: false
        cast_mode:
          type: string
          enum: [append, replace]
          default: append
          description: >
            append adds new scenes without deleting existing ones (normalized
            name match skips). replace overwrites by index and removes orphans.
    SceneProfile:
      type: object
      additionalProperties: false
      required: [description, lighting, palette, visual_traits]
      properties:
        description:
          type: string
        lighting:
          type: string
        palette:
          type: string
        visual_traits:
          type: array
          items:
            type: string
    ScenePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        profile:
          $ref: '#/components/schemas/SceneProfile'
        status:
          type: string
          enum: [draft, in_review, approved]
    Scene:
      type: object
      additionalProperties: false
      required: [id, project_id, name, profile, status, version]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        profile:
          $ref: '#/components/schemas/SceneProfile'
        reference_asset_id:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          enum: [draft, in_review, approved]
        version:
          type: integer
          minimum: 1
    StoryboardGenerationRequest:
      type: object
      additionalProperties: false
      required: [episode_id, panel_count]
      properties:
        episode_id:
          type: string
          format: uuid
        panel_count:
          type: integer
          minimum: 1
          maximum: 60
        pacing:
          type: string
          enum: [fast, balanced, slow]
          default: balanced
        use_approved_assets:
          type: boolean
          default: true
        use_continuity:
          type: boolean
          default: true
          description: Inject previous episode summaries and open plot threads
    StoryPipelineRequest:
      type: object
      additionalProperties: false
      required: [episode_id, panel_count]
      properties:
        episode_id:
          type: string
          format: uuid
        panel_count:
          type: integer
          minimum: 1
          maximum: 60
        pacing:
          type: string
          enum: [fast, balanced, slow]
          default: balanced
        regenerate_characters:
          type: boolean
          default: true
          description: When false, skip the character stage and reuse the project cast.
        character_cast_mode:
          type: string
          enum: [append, replace]
          default: append
          description: Applied only when regenerate_characters is true.
        scene_cast_mode:
          type: string
          enum: [append, replace]
          default: append
          description: Applied when the pipeline runs the scene stage.
        use_approved_assets:
          type: boolean
          default: true
        use_continuity:
          type: boolean
          default: true
          description: Inject previous episode summaries and open plot threads
    StoryboardPanelPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        position:
          type: integer
          minimum: 0
        scene_description:
          type: string
          maxLength: 4000
        shot:
          type: string
          maxLength: 240
        composition:
          type: string
          maxLength: 2000
        character_actions:
          type: string
          maxLength: 2000
        emotion:
          type: string
          maxLength: 240
        dialogue:
          type: string
          maxLength: 4000
        story_purpose:
          type: string
          maxLength: 1000
        image_prompt:
          type: string
          maxLength: 8000
        character_ids:
          type: array
          items:
            type: string
            format: uuid
        scene_id:
          type: [string, 'null']
          format: uuid
        review_status:
          type: string
          enum: [draft, in_review, approved]
    StoryboardPanelCreate:
      type: object
      additionalProperties: false
      required: [scene_description, shot, composition, character_actions, emotion, dialogue, story_purpose, image_prompt]
      properties:
        id:
          type: string
          format: uuid
        scene_description:
          type: string
          maxLength: 4000
        shot:
          type: string
          maxLength: 240
        composition:
          type: string
          maxLength: 2000
        character_actions:
          type: string
          maxLength: 2000
        emotion:
          type: string
          maxLength: 240
        dialogue:
          type: string
          maxLength: 4000
        story_purpose:
          type: string
          maxLength: 1000
        image_prompt:
          type: string
          maxLength: 8000
        character_ids:
          type: array
          items:
            type: string
            format: uuid
        scene_id:
          type: [string, 'null']
          format: uuid
    PanelOrder:
      type: object
      additionalProperties: false
      required: [panel_ids]
      properties:
        panel_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
    StoryboardPanel:
      allOf:
        - $ref: '#/components/schemas/StoryboardPanelPatch'
        - type: object
          required: [id, episode_id, position, review_status, version, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
            episode_id:
              type: string
              format: uuid
            review_status:
              type: string
              enum: [draft, in_review, approved]
            current_image_asset_id:
              type: [string, 'null']
              format: uuid
            character_ids:
              type: array
              items:
                type: string
                format: uuid
            scene_id:
              type: [string, 'null']
              format: uuid
            version:
              type: integer
              minimum: 1
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    PanelImageGenerationRequest:
      type: object
      additionalProperties: false
      properties:
        instruction:
          type: string
          maxLength: 4000
        reference_character_ids:
          type: array
          items:
            type: string
            format: uuid
        reference_location_ids:
          type: array
          items:
            type: string
            format: uuid
        idempotency_key:
          type: string
          maxLength: 128
        acknowledge_trial:
          type: boolean
          default: false
          description: >
            Required when the project has no characters and the panel is not an
            empty-character establishing shot. Confirms the user accepts trial
            generation without cast consistency.
    ExportRequest:
      type: object
      additionalProperties: false
      required: [format]
      properties:
        format:
          type: string
          enum: [png, png_zip, production_json]
          description: >
            png is one vertical strip; png_zip packs panels into page-sized PNGs
            inside a ZIP (page-01.png …); production_json is editorial metadata.
        include_unapproved_panels:
          type: boolean
          default: false
    ManuscriptExportRequest:
      type: object
      additionalProperties: false
      required: [format]
      properties:
        format:
          type: string
          enum: [png, png_zip, pdf]
          description: >
            Manuscript formats only. png is one vertical strip from layout slots;
            png_zip is one PNG per layout page; pdf is one multi-page document
            (one layout page per PDF page). No production_json.
    AnthologyExportRequest:
      type: object
      additionalProperties: false
      required: [format, episode_ids]
      properties:
        format:
          type: string
          enum: [png_zip, pdf]
          description: png_zip nests pages per episode; pdf is one multi-page document.
        episode_ids:
          type: array
          minItems: 1
          maxItems: 40
          items:
            type: string
            format: uuid
          description: Episodes to include, in the order provided.
        include_unapproved_panels:
          type: boolean
          default: false
    GenerationProviderResumeRequest:
      type: object
      additionalProperties: false
      properties:
        remote_task_id:
          type: [string, 'null']
          maxLength: 128
          description: Confirmed DashScope/async task id to bind before resume
        job_key:
          type: [string, 'null']
          maxLength: 128
          description: Provider job checkpoint key, e.g. character:<uuid>
        acknowledge_resubmit:
          type: boolean
          default: false
          description: >
            Explicitly allow a new image submit when no remote_task_id is known;
            may duplicate billing.
    GenerationTask:
      type: object
      additionalProperties: false
      required: [id, task_type, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: [string, 'null']
          format: uuid
        episode_id:
          type: [string, 'null']
          format: uuid
        panel_id:
          type: [string, 'null']
          format: uuid
        task_type:
          type: string
          enum: [character_draft, character_reference_images, scene_draft, scene_reference_images, storyboard_draft, story_pipeline, panel_image, panel_image_edit, export]
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        progress:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        result:
          oneOf:
            - $ref: '#/components/schemas/SceneGenerationResult'
            - $ref: '#/components/schemas/CharacterGenerationResult'
            - $ref: '#/components/schemas/StoryboardGenerationResult'
            - $ref: '#/components/schemas/StoryPipelineResult'
            - $ref: '#/components/schemas/PanelImageGenerationResult'
            - $ref: '#/components/schemas/ExportResult'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/Problem'
            - type: 'null'
        retry_of_task_id:
          type: [string, 'null']
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CharacterGenerationResult:
      type: object
      additionalProperties: false
      required: [character_ids]
      properties:
        character_ids:
          type: array
          items:
            type: string
            format: uuid
        warnings:
          type: array
          items:
            type: string
    StoryboardGenerationResult:
      type: object
      additionalProperties: false
      required: [episode_id, panel_ids]
      properties:
        episode_id:
          type: string
          format: uuid
        panel_ids:
          type: array
          items:
            type: string
            format: uuid
    StoryPipelineResult:
      type: object
      additionalProperties: false
      required: [episode_id, panel_ids]
      properties:
        character_ids:
          type: array
          items:
            type: string
            format: uuid
        scene_ids:
          type: array
          items:
            type: string
            format: uuid
        episode_id:
          type: string
          format: uuid
        panel_ids:
          type: array
          items:
            type: string
            format: uuid
        warnings:
          type: array
          items:
            type: string
    PanelImageGenerationResult:
      type: object
      additionalProperties: false
      required: [panel_id, asset_id]
      properties:
        panel_id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
    SceneGenerationResult:
      type: object
      additionalProperties: false
      required: [scene_ids]
      properties:
        scene_ids:
          type: array
          items:
            type: string
            format: uuid
        reference_images_generated:
          type: integer
          minimum: 0
        warnings:
          type: array
          items:
            type: string
    PanelImageVersion:
      type: object
      additionalProperties: false
      required: [id, panel_id, asset_id, image_url, is_current, created_at]
      properties:
        id:
          type: string
          format: uuid
        panel_id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        image_url:
          type: string
          format: uri-reference
        is_current:
          type: boolean
        created_at:
          type: string
          format: date-time
    BootstrapLayoutRequest:
      type: object
      additionalProperties: false
      properties:
        default_height_px:
          type: integer
          minimum: 80
          maximum: 4096
          default: 720
        default_gap_px:
          type: integer
          minimum: 0
          maximum: 512
          default: 24
    SyncLayoutRequest:
      type: object
      additionalProperties: false
      properties:
        follow_current_version:
          type: boolean
          default: true
          description: When true, retarget existing slots to each panel's current image version.
    PageOrder:
      type: object
      additionalProperties: false
      required: [page_ids]
      properties:
        page_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
    SlotOrder:
      type: object
      additionalProperties: false
      required: [slot_ids]
      properties:
        slot_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
    PageSlotPatch:
      type: object
      additionalProperties: false
      properties:
        height_px:
          type: integer
          minimum: 80
          maximum: 4096
        gap_after_px:
          type: integer
          minimum: 0
          maximum: 512
        image_version_id:
          type: [string, 'null']
          format: uuid
          description: Must belong to the slot's panel; null clears the pin (placeholder).
        follow_current_version:
          type: boolean
          description: When true, future panel version selections update this slot by default.
    SeedLetteringRequest:
      type: object
      additionalProperties: false
      properties:
        replace_existing:
          type: boolean
          default: false
          description: >
            When true, delete existing lettering on slots that will be seeded
            before creating defaults. When false, skip slots that already have lettering.
    LetteringObjectCreate:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [speech_bubble, narration]
        text:
          type: string
          minLength: 1
          maxLength: 4000
        x_pct:
          type: number
          minimum: 0
          maximum: 100
          default: 8
          description: Left edge as percent of slot width.
        y_pct:
          type: number
          minimum: 0
          maximum: 100
          default: 6
          description: Top edge as percent of slot height.
        width_pct:
          type: number
          minimum: 10
          maximum: 100
          default: 60
          description: Box width as percent of slot width.
        tail:
          type: string
          enum: [none, bottom_left, bottom_right, top_left, top_right]
          default: bottom_left
        font_size:
          type: string
          enum: [sm, md, lg]
          default: md
    LetteringObjectPatch:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [speech_bubble, narration]
        text:
          type: string
          minLength: 1
          maxLength: 4000
        x_pct:
          type: number
          minimum: 0
          maximum: 100
        y_pct:
          type: number
          minimum: 0
          maximum: 100
        width_pct:
          type: number
          minimum: 10
          maximum: 100
        tail:
          type: string
          enum: [none, bottom_left, bottom_right, top_left, top_right]
        font_size:
          type: string
          enum: [sm, md, lg]
        position:
          type: integer
          minimum: 0
          description: Order among lettering objects on the same slot.
    LetteringObject:
      type: object
      additionalProperties: false
      required:
        - id
        - slot_id
        - kind
        - text
        - x_pct
        - y_pct
        - width_pct
        - tail
        - font_size
        - position
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        slot_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [speech_bubble, narration]
        text:
          type: string
          maxLength: 4000
        x_pct:
          type: number
          minimum: 0
          maximum: 100
        y_pct:
          type: number
          minimum: 0
          maximum: 100
        width_pct:
          type: number
          minimum: 10
          maximum: 100
        tail:
          type: string
          enum: [none, bottom_left, bottom_right, top_left, top_right]
        font_size:
          type: string
          enum: [sm, md, lg]
        position:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PageSlot:
      type: object
      additionalProperties: false
      required:
        - id
        - page_id
        - position
        - panel_id
        - image_version_id
        - height_px
        - gap_after_px
        - follow_current_version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        page_id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
        panel_id:
          type: string
          format: uuid
        image_version_id:
          type: [string, 'null']
          format: uuid
        height_px:
          type: integer
          minimum: 80
          maximum: 4096
        gap_after_px:
          type: integer
          minimum: 0
          maximum: 512
        follow_current_version:
          type: boolean
        lettering:
          type: array
          description: >
            Slot-anchored lettering (LETTER A2). Omitted or empty until seeded/created.
            Clients treat missing as an empty list.
          items:
            $ref: '#/components/schemas/LetteringObject'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LayoutPage:
      type: object
      additionalProperties: false
      required: [id, episode_id, position, template, slots, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        episode_id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
        template:
          type: string
          enum: [vertical_strip]
        slots:
          type: array
          items:
            $ref: '#/components/schemas/PageSlot'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EpisodeLayout:
      type: object
      additionalProperties: false
      required: [episode_id, template, pages]
      properties:
        episode_id:
          type: string
          format: uuid
        template:
          type: string
          enum: [vertical_strip]
        pages:
          type: array
          items:
            $ref: '#/components/schemas/LayoutPage'
    LayoutPreviewItem:
      type: object
      additionalProperties: false
      required: [slot_id, page_id, panel_id, height_px, gap_after_px, image_url]
      properties:
        slot_id:
          type: string
          format: uuid
        page_id:
          type: string
          format: uuid
        panel_id:
          type: string
          format: uuid
        height_px:
          type: integer
        gap_after_px:
          type: integer
        image_url:
          type: [string, 'null']
          format: uri-reference
          description: Null when the slot has no pinned image version.
        lettering:
          type: array
          description: Overlay objects for manuscript preview; missing means none.
          items:
            $ref: '#/components/schemas/LetteringObject'
    LayoutPreview:
      type: object
      additionalProperties: false
      required: [episode_id, kind, width_hint_px, items]
      properties:
        episode_id:
          type: string
          format: uuid
        kind:
          type: string
          const: manuscript_preview
          description: Distinguishes from Studio production view and EXP downloads.
        width_hint_px:
          type: integer
          minimum: 320
          maximum: 1200
          default: 720
        items:
          type: array
          items:
            $ref: '#/components/schemas/LayoutPreviewItem'
    ExportResult:
      type: object
      additionalProperties: false
      required: [asset_id, download_url, expires_at]
      properties:
        asset_id:
          type: string
          format: uuid
        download_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    Problem:
      type: object
      additionalProperties: true
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
