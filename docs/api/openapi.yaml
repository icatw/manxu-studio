          type: boolean
          description: GitHub identities are verified after OAuth; email identities are verified after a successful email code.
    ModelConfigUpdate:
      type: object
      additionalProperties: false
      required: [text_model, text_base_url, image_model]
      properties:
        text_model: { type: string, minLength: 1, maxLength: 160 }
        text_base_url: { type: string, format: uri, pattern: '^https://' }
        text_api_key:
          type: [string, 'null']
          minLength: 1
          maxLength: 4096
          description: Omit to keep the existing key, null to clear it, or provide a replacement.
        image_model:
          type: string
          minLength: 1
          maxLength: 80
          description: Must be one of the server allowlisted image model IDs returned by GET /model-config.
        image_base_url:
          type: [string, 'null']
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: Omit or set null to keep the existing address, or provide a Qwen Image API base URL.
        image_api_key:
          type: [string, 'null']
          minLength: 1
          maxLength: 4096
          description: Omit to keep the existing key, null to clear it, or provide a replacement.
