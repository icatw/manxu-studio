          type: [string, 'null']
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: Omit or set null to keep the existing address, or provide a Qwen Image API base URL.
        image_api_key:
          type: [string, 'null']
          minLength: 1
          maxLength: 4096
          description: Omit to keep the existing key, null to clear it, or provide a replacement.
