openapi: 3.1.0
x-contract-status: frozen
info:
  title: Manxu Studio API
  version: 1.0.0
  summary: AI comic pre-production workspace API
  description: >-
    Contract-first API for projects, storyboards, generation tasks, and exports.
    First-release operations map to confirmed requirements in the PRD. The contract is frozen for the core pre-production workflow.
servers:
  - url: /api/v1
    description: Versioned API base path
tags:
  - name: Authentication
    description: Email, GitHub OAuth, and account session
  - name: ModelSettings
    description: User-owned text and image model settings
  - name: System
    description: Service metadata and operational checks
  - name: Projects
    description: User-owned story projects
  - name: Episodes
    description: Story units within a project
  - name: Characters
    description: Reusable character profiles
  - name: Scenes
    description: Reusable scene profiles
  - name: Storyboards
    description: Ordered panels and storyboard versions
  - name: Layout
    description: Episode page layout and vertical-strip slots (PAGE A1)
  - name: Lettering
    description: Slot-anchored speech bubbles and narration (LETTER A2)
  - name: Generations
    description: Asynchronous text and image generation tasks
  - name: Exports
    description: Storyboard and production material exports (EXP)
  - name: Publish
    description: Manuscript exports from Page + Lettering (PUBLISH A3)
security:
  - SessionCookie: []
  - BearerSession: []
paths:
  /health:
    get:
      security: []
      tags: [System]
      operationId: getHealth
      summary: Check API process health
      responses:
        '200':
          description: API process is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessHealthStatus'
  /version:
    get:
      security: []
      tags: [System]
      operationId: getVersion
      summary: Get API version
      responses:
        '200':
          description: Running API version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessVersionInfo'
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects
      x-requirement-ids: [PROJ-01]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Project page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessProjectPage'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      x-requirement-ids: [PROJ-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessProject'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /projects/plan:
    post:
      tags: [Serial]
      operationId: planProject
      summary: AI season plan from a premise
      x-requirement-ids: [SERIAL-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPlanRequest'
      responses:
        '200':
          description: Plan draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessProjectPlanDraft'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /projects/from-plan:
    post:
      tags: [Serial]
      operationId: createProjectFromPlan
      summary: Create a project from a confirmed plan draft
      x-requirement-ids: [SERIAL-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectFromPlanCreate'
      responses:
        '201':
          description: Project created from plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessProjectFromPlanResult'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /projects/{project_id}/continuity:
    get:
      tags: [Serial]
      operationId: getProjectContinuity
      summary: Continuity context for the next episode
      x-requirement-ids: [SERIAL-03]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Continuity payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessProjectContinuity'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /projects/{project_id}/plot-threads:
    get:
      tags: [Serial]
      operationId: listPlotThreads
      summary: List plot threads for a project
      x-requirement-ids: [SERIAL-02]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Plot threads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessPlotThreadList'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [Serial]
      operationId: createPlotThread
      summary: Create a plot thread
      x-requirement-ids: [SERIAL-02]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlotThreadCreate'
      responses:
        '201':
          description: Thread created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessPlotThread'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /plot-threads/{thread_id}:
    patch:
      tags: [Serial]
      operationId: updatePlotThread
      summary: Update a plot thread
      x-requirement-ids: [SERIAL-02]
      parameters:
        - name: thread_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlotThreadPatch'
      responses:
        '200':
          description: Thread updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessPlotThread'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      tags: [Serial]
      operationId: deletePlotThread
      summary: Delete a plot thread
      x-requirement-ids: [SERIAL-02]
      parameters:
        - name: thread_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /episodes/{episode_id}/summary:
    post:
      tags: [Serial]
      operationId: generateEpisodeSummary
      summary: Generate or refresh an episode summary
      x-requirement-ids: [SERIAL-03]
      parameters:
        - $ref: '#/components/parameters/EpisodeId'
      responses:
        '200':
          description: Summary saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEpisodeSummaryResult'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /episodes/{episode_id}/reader:
    get:
      tags: [Serial]
      operationId: getEpisodeReader
      summary: Reader payload for an episode
      x-requirement-ids: [SERIAL-04]
      parameters:
        - $ref: '#/components/parameters/EpisodeId'
      responses:
        '200':
          description: Reader page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEpisodeReader'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /auth/github/start:
    get:
      security: []
      tags: [Authentication]
      operationId: startGitHubLogin
      summary: Start GitHub OAuth login
      x-requirement-ids: [AUTH-01]
      responses:
        '302':
          description: Redirect to GitHub authorization
          headers:
            Location:
              schema: { type: string, format: uri }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default:
          $ref: '#/components/responses/UnexpectedError'
  /auth/email/code:
    post:
      security: []
      tags: [Authentication]
      operationId: requestEmailCode
      summary: Send an email login code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailCodeRequest' }
      responses:
        '202':
          description: Code accepted for delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccessEmailCodeAccepted' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Refresh the browser CSRF token
      responses:
        '200':
          description: CSRF token refreshed in a cookie
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CsrfToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/UnexpectedError' }
  /auth/email/verify:
    post:
      security: []
      tags: [Authentication]
      operationId: verifyEmailCode
      summary: Verify an email login code and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailVerifyRequest' }
      responses:
        '200':
          description: Signed-in account
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccessAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/github/callback:
    get:
      security: []
      tags: [Authentication]
      operationId: completeGitHubLogin
      summary: Complete GitHub OAuth and establish a session
      x-requirement-ids: [AUTH-01, AUTH-02]
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        '302':
          description: Redirect to the app after login or a user-visible OAuth error
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              schema: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default:
          $ref: '#/components/responses/UnexpectedError'
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentAccount
      summary: Get the signed-in account
      x-requirement-ids: [AUTH-01]
      responses:
        '200':
          description: Current account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccessAccount' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Authentication]
      operationId: updateCurrentAccount
      summary: Update the current account's editable profile
      x-requirement-ids: [AUTH-03]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountProfileUpdate' }
      responses:
        '200':
          description: Updated current account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccessAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: End the current account session
      x-requirement-ids: [AUTH-01]
      responses:
        '204': { description: Session ended }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/identities:
    get:
      tags: [Authentication]
      operationId: listAuthIdentities
      summary: List login identities for the current account
      responses:
        '200':
          description: Login identity summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccessIdentityList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/identities/{identity_id}:
    delete:
      tags: [Authentication]
      operationId: deleteAuthIdentity
      summary: Remove a login identity
      parameters:
        - name: identity_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Login identity removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /model-config:
    get:
      tags: [ModelSettings]
      operationId: getModelConfig
      summary: Read the current account's model settings without secrets
      x-requirement-ids: [MODEL-01, MODEL-02, MODEL-03]
      responses:
        '200':
          description: Configured models and integration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessModelConfig'
        default:
          $ref: '#/components/responses/UnexpectedError'
    put:
      tags: [ModelSettings]
      operationId: updateModelConfig
      summary: Update the current account's model settings
      x-requirement-ids: [MODEL-01, MODEL-02, MODEL-03]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelConfigUpdate' }
      responses:
        '200':
          description: Updated settings without secret values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccessModelConfig' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /model-config/test:
    post:
      tags: [ModelSettings]
      operationId: testTextModelConnection
      summary: Test the configured text model connection
      x-requirement-ids: [MODEL-01]
      responses:
        '200':
          description: Connection test result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccessModelConnectionTest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /model-config/test-image:
    post:
      tags: [ModelSettings]
      operationId: testImageModelConnection
      summary: Test the configured Qwen Image model connection
      x-requirement-ids: [MODEL-02]
      responses:
        '200':
          description: Image connection test result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiSuccessModelConnectionTest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /assets/{asset_id}:
    parameters:
      - name: asset_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Generations]
      operationId: getImageAsset
      summary: Read a generated image via ownership-checked API proxy
      description: >
        Streams image bytes from private object storage (local directory or S3-compatible
        backend). Missing and foreign-owned assets both return 404. Presigned public URLs
        are out of scope for this operation.
      x-requirement-ids: [MODEL-02, GEN-02, INFRA-02]
      responses:
        '200':
          description: Generated image bytes (private; Cache-Control private, no-store)
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project
      x-requirement-ids: [PROJ-01]
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessProject'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Update project details
      x-requirement-ids: [PROJ-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessProject'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project and its project-owned records
      x-requirement-ids: [PROJ-03]
      responses:
        '204':
          description: Project deleted
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /projects/{project_id}/episodes:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Episodes]
      operationId: listEpisodes
      summary: List episodes in a project
      x-requirement-ids: [STORY-01]
      responses:
        '200':
          description: Episodes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEpisodeList'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [Episodes]
      operationId: createEpisode
      summary: Create an episode or story segment
      x-requirement-ids: [STORY-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpisodeCreate'
      responses:
        '201':
          description: Episode created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEpisode'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /episodes/{episode_id}:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    patch:
      tags: [Episodes]
      operationId: updateEpisode
      summary: Update a story unit
      x-requirement-ids: [STORY-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpisodePatch'
      responses:
        '200':
          description: Updated story unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEpisode'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /projects/{project_id}/scenes:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Scenes]
      operationId: listScenes
      summary: List scene assets
      x-requirement-ids: [ASSET-02]
      responses:
        '200':
          description: Scene assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessSceneList'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /scenes/{scene_id}:
    parameters:
      - name: scene_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Scenes]
      operationId: updateScene
      summary: Edit or approve a scene profile
      x-requirement-ids: [ASSET-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenePatch'
      responses:
        '200':
          description: Updated scene
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessScene'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /projects/{project_id}/scene-generations:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Scenes, Generations]
      operationId: generateScenes
      summary: Generate scene profile drafts from the project story
      x-requirement-ids: [ASSET-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneGenerationRequest'
      responses:
        '202':
          description: Generation task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessGenerationTask'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /projects/{project_id}/characters:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Characters]
      operationId: listCharacters
      summary: List character assets
      x-requirement-ids: [ASSET-01]
      responses:
        '200':
          description: Character assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessCharacterList'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /characters/{character_id}:
    parameters:
      - name: character_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Characters]
      operationId: updateCharacter
      summary: Edit or approve a character profile
      x-requirement-ids: [ASSET-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterPatch'
      responses:
        '200':
          description: Updated character
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessCharacter'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /projects/{project_id}/character-generations:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Characters, Generations]
      operationId: generateCharacters
      summary: Generate character profile drafts from the project story
      x-requirement-ids: [ASSET-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterGenerationRequest'
      responses:
        '202':
          description: Generation task accepted
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              description: URL of the generation task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessGenerationTask'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /projects/{project_id}/storyboard-generations:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Storyboards, Generations]
      operationId: generateStoryboard
      summary: Generate storyboard drafts for an episode
      x-requirement-ids: [SB-01]
