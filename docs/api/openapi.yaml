      type: object
      additionalProperties: false
      required: [text_provider, text_model, text_base_url, text_api_key_configured, text_status, image_provider, image_model, image_base_url, image_api_key_configured, image_concurrency, image_negative_prompt, image_status, image_models, system_presets]
