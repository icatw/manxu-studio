        '204':
          description: Panel deleted
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /panels/{panel_id}/image-versions:
    parameters:
      - $ref: '#/components/parameters/PanelId'
    get:
      tags: [Generations]
      operationId: listPanelImageVersions
      summary: List generated image versions for a panel
      x-requirement-ids: [GEN-01, GEN-04]
      responses:
        '200':
          description: Image versions ordered newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessPanelImageVersionList'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /panels/{panel_id}/image-versions/{version_id}/selection:
    parameters:
      - $ref: '#/components/parameters/PanelId'
      - name: version_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Generations]
      operationId: selectPanelImageVersion
      summary: Select the current image version for a panel
      x-requirement-ids: [GEN-04]
      responses:
        '200':
          description: Selected image version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessPanelImageVersion'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /panels/{panel_id}/image-generations:
    parameters:
      - $ref: '#/components/parameters/PanelId'
    post:
      tags: [Storyboards, Generations]
      operationId: generatePanelImage
      summary: Generate a new image version for one panel
      description: >
        When the project has no characters, requires acknowledge_trial=true or
        returns 409 with code CAST_REQUIRED (GEN-05). Establishing shots
        (empty character_ids) are only exempt when the project already has a cast.
      x-requirement-ids: [GEN-01, GEN-05]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PanelImageGenerationRequest'
      responses:
        '202':
          description: Image generation task accepted
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              description: URL of the generation task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessGenerationTask'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflict, including CAST_REQUIRED when cast is missing without trial ack
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /generation-tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Generations]
      operationId: getGenerationTask
      summary: Get task state and result
      x-requirement-ids: [GEN-02]
      responses:
        '200':
          description: Generation task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessGenerationTask'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /generation-tasks/{task_id}/retries:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Generations]
      operationId: retryGenerationTask
      summary: Retry a failed generation as a new task
      description: >
        Creates a new task after stripping provider/pipeline checkpoints.
        Rejected with 409 when the failure code is PROVIDER_SUBMIT_AMBIGUOUS or
        RECOVERY_EXHAUSTED; use provider-resumes instead.
      x-requirement-ids: [GEN-03]
      responses:
        '202':
          description: Retry task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessGenerationTask'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /generation-tasks/{task_id}/provider-resumes:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Generations]
      operationId: resumeProviderGenerationTask
      summary: Resume a provider-protected failed task without discarding checkpoints
      description: >
        Requeues the same task while keeping provider/text checkpoints.
        Required for PROVIDER_SUBMIT_AMBIGUOUS and RECOVERY_EXHAUSTED failures.
        A remote task id already saved in the checkpoint is resumed automatically.
        Otherwise, ambiguous submits require a confirmed remote_task_id or
        acknowledge_resubmit=true to accept possible duplicate billing.
      x-requirement-ids: [GEN-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationProviderResumeRequest'
      responses:
        '202':
          description: Same task requeued for provider-safe resume
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessGenerationTask'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /episodes/{episode_id}/generation-tasks:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    get:
      tags: [Generations]
      operationId: listEpisodeGenerationTasks
      summary: List generation tasks for an episode
      description: >
        Returns tasks owned through the episode. When active_only is true (default),
        only queued and running tasks are returned so the studio can resume polling
        after reload.
      x-requirement-ids: [GEN-02]
      parameters:
        - name: active_only
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Episode generation tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessGenerationTaskList'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /episodes/{episode_id}/exports:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    post:
      tags: [Exports, Generations]
      operationId: createEpisodeExport
      summary: Create an export for the current episode state
      description: >
        Production preview export (EXP). PNG overlays bake Lettering when the panel
        slot has lettering objects; otherwise fall back to storyboard dialogue.
        Not a manuscript/PUBLISH export.
      x-requirement-ids: [EXP-01, LETTER-02, LETTER-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '202':
          description: Export task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessGenerationTask'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /episodes/{episode_id}/manuscript-exports:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    post:
      tags: [Publish, Generations]
      operationId: createEpisodeManuscriptExport
      summary: Create a manuscript export from layout pages and lettering
      description: >
        PUBLISH-01 manuscript export. Composes Page/Slot order and geometry with
        Lettering overlays only (no storyboard dialogue fallback). Requires an
        existing vertical-strip layout (409 if missing). Distinct from EXP
        createEpisodeExport.
      x-requirement-ids: [PUBLISH-01, PAGE-01, LETTER-01, LETTER-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManuscriptExportRequest'
      responses:
        '202':
          description: Manuscript export task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessGenerationTask'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /projects/{project_id}/exports:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Exports, Generations, Projects]
      operationId: createProjectAnthologyExport
      summary: Export selected episodes as a multi-episode anthology ZIP or PDF
      x-requirement-ids: [EXP-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthologyExportRequest'
      responses:
        '202':
          description: Anthology export task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessGenerationTask'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /episodes/{episode_id}/layout:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    get:
      tags: [Layout]
      operationId: getEpisodeLayout
      summary: Get persisted page layout for an episode
      x-requirement-ids: [PAGE-01, PAGE-02]
      responses:
        '200':
          description: Episode layout (empty pages array when not bootstrapped)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEpisodeLayout'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /episodes/{episode_id}/layout/bootstrap:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    post:
      tags: [Layout]
      operationId: bootstrapEpisodeLayout
      summary: Create default vertical-strip pages from current panel order
      description: >
        Creates one vertical_strip page with one slot per panel in storyboard order.
        Slots pin each panel's current image version when present.
        Fails with 409 if a layout already exists; use sync to reconcile panel changes.
      x-requirement-ids: [PAGE-01, PAGE-02]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapLayoutRequest'
      responses:
        '201':
          description: Default layout created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEpisodeLayout'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /episodes/{episode_id}/layout/sync:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    post:
      tags: [Layout]
      operationId: syncEpisodeLayout
      summary: Reconcile layout slots with current storyboard panels
      description: >
        Adds slots for new panels (append), removes slots for deleted panels,
        and retargets slots to each panel's current image version when
        follow_current_version is true (default). Preserves height and gap for
        surviving slots. Requires an existing layout.
      x-requirement-ids: [PAGE-03]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncLayoutRequest'
      responses:
        '200':
          description: Layout after sync
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEpisodeLayout'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /episodes/{episode_id}/layout/preview:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    get:
      tags: [Layout]
      operationId: getEpisodeLayoutPreview
      summary: Manuscript-style vertical preview payload for the episode layout
      description: >
        Ordered strip items with image URLs and lettering overlays for manuscript preview.
        Lettering is layered in the client; pixels are not baked into image assets (LETTER-02).
      x-requirement-ids: [PAGE-01, PAGE-02, LETTER-01, LETTER-02]
      responses:
        '200':
          description: Ordered preview strip items (may include placeholders)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessLayoutPreview'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /episodes/{episode_id}/pages/order:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    put:
      tags: [Layout]
      operationId: reorderPages
      summary: Replace the ordered page IDs for an episode
      x-requirement-ids: [PAGE-01, PAGE-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageOrder'
      responses:
        '200':
          description: Updated layout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEpisodeLayout'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /pages/{page_id}/slots/order:
    parameters:
      - $ref: '#/components/parameters/PageId'
    put:
      tags: [Layout]
      operationId: reorderPageSlots
      summary: Replace the ordered slot IDs within a page
      x-requirement-ids: [PAGE-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotOrder'
      responses:
        '200':
          description: Updated page with slots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessLayoutPage'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /slots/{slot_id}:
    parameters:
      - $ref: '#/components/parameters/SlotId'
    patch:
      tags: [Layout]
      operationId: updatePageSlot
      summary: Update slot geometry or pinned image version
      x-requirement-ids: [PAGE-02, PAGE-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageSlotPatch'
      responses:
        '200':
          description: Updated slot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessPageSlot'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /episodes/{episode_id}/layout/lettering/seed:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    post:
      tags: [Lettering]
      operationId: seedLetteringFromDialogue
      summary: Create default speech bubbles from panel dialogue for empty slots
      description: >
        For each layout slot whose panel has non-empty dialogue and which has no
        lettering objects yet, creates one default speech_bubble.
        When replace_existing is true, deletes existing lettering on those slots
        before seeding. Does not modify Studio panel.dialogue.
      x-requirement-ids: [LETTER-01, LETTER-02]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeedLetteringRequest'
      responses:
        '200':
          description: Layout including seeded lettering
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessEpisodeLayout'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /slots/{slot_id}/lettering:
    parameters:
      - $ref: '#/components/parameters/SlotId'
    post:
      tags: [Lettering]
      operationId: createLetteringObject
      summary: Add a lettering object to a page slot
      x-requirement-ids: [LETTER-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LetteringObjectCreate'
      responses:
        '201':
          description: Created lettering object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessLetteringObject'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /lettering/{lettering_id}:
    parameters:
      - $ref: '#/components/parameters/LetteringId'
    patch:
      tags: [Lettering]
      operationId: updateLetteringObject
      summary: Update lettering text, geometry, or style
      x-requirement-ids: [LETTER-01, LETTER-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LetteringObjectPatch'
      responses:
        '200':
          description: Updated lettering object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessLetteringObject'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      tags: [Lettering]
      operationId: deleteLetteringObject
      summary: Delete a lettering object
      x-requirement-ids: [LETTER-01]
      responses:
        '204':
          description: Lettering object deleted
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /exports/{asset_id}:
    parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Exports]
      operationId: downloadExport
      summary: Download a completed export
      x-requirement-ids: [EXP-01, EXP-02]
      responses:
        '200':
          description: Export file (PNG strip, paginated ZIP, PDF, or JSON)
          content:
            image/png:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: manxu_session
    BearerSession:
      type: http
      scheme: bearer
      description: Opaque account session token for non-browser API clients.
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EpisodeId:
      name: episode_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PanelId:
      name: panel_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageId:
      name: page_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SlotId:
      name: slot_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LetteringId:
      name: lettering_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    Conflict:
      description: Operation conflicts with the current resource state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiValidationErrorEnvelope' }
    UnexpectedError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
    ServiceUnavailable:
      description: Required service is unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorEnvelope' }
  schemas:
    ApiSuccessEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data, request_id]
      properties:
        code: { type: string, const: OK }
        message: { type: string }
        data: {}
        request_id: { type: string, format: uuid }
    ApiErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data, request_id]
      properties:
        code:
          type: string
          enum: [BAD_REQUEST, AUTH_REQUIRED, FORBIDDEN, CSRF_INVALID, NOT_FOUND, CONFLICT, RATE_LIMITED, SERVICE_UNAVAILABLE, HTTP_ERROR, INTERNAL_ERROR]
        message: { type: string }
        data: { type: 'null' }
        request_id: { type: string, format: uuid }
    ApiValidationErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiErrorEnvelope'
        - type: object
          required: [errors]
          properties:
            code: { type: string, const: VALIDATION_FAILED }
            errors:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, code, message]
                properties:
                  field: { type: string }
                  code: { type: string }
                  message: { type: string }
    ApiSuccessHealthStatus:
      allOf:
