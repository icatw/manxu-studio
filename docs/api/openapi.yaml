      x-requirement-ids: [SB-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryboardPanelCreate'
      responses:
        '201':
          description: Created storyboard panel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessStoryboardPanel'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /episodes/{episode_id}/panels/order:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    put:
      tags: [Storyboards]
      operationId: reorderPanels
      summary: Replace the ordered storyboard panel IDs
      x-requirement-ids: [SB-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PanelOrder'
      responses:
        '200':
          description: Updated ordered storyboard panels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessStoryboardPanelList'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /panels/{panel_id}:
    parameters:
      - $ref: '#/components/parameters/PanelId'
    patch:
      tags: [Storyboards]
      operationId: updatePanel
      summary: Edit storyboard panel content or order
      x-requirement-ids: [SB-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryboardPanelPatch'
      responses:
        '200':
          description: Updated panel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessStoryboardPanel'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
