openapi: 3.1.0
x-contract-status: frozen
info:
  title: Manxu Studio API
  version: 1.0.0
  summary: AI comic pre-production workspace API
  description: >-
    Contract-first API for projects, storyboards, generation tasks, and exports.
    First-release operations map to confirmed requirements in the PRD. The contract is frozen for the core pre-production workflow.
servers:
  - url: /api/v1
    description: Versioned API base path
tags:
  - name: Authentication
    description: GitHub OAuth and account session
  - name: ModelSettings
    description: User-owned text and image model settings
  - name: System
    description: Service metadata and operational checks
  - name: Projects
    description: User-owned story projects
  - name: Episodes
    description: Story units within a project
  - name: Characters
    description: Reusable character profiles
  - name: Scenes
    description: Reusable scene profiles
  - name: Storyboards
    description: Ordered panels and storyboard versions
  - name: Generations
    description: Asynchronous text and image generation tasks
  - name: Exports
    description: Storyboard and production material exports
security:
  - SessionCookie: []
paths:
  /health:
    get:
      security: []
      tags: [System]
      operationId: getHealth
      summary: Check API process health
      responses:
        '200':
          description: API process is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /version:
    get:
      security: []
      tags: [System]
      operationId: getVersion
      summary: Get API version
      responses:
        '200':
          description: Running API version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects
      x-requirement-ids: [PROJ-01]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Project page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      x-requirement-ids: [PROJ-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /auth/github/start:
    get:
      security: []
      tags: [Authentication]
      operationId: startGitHubLogin
      summary: Start GitHub OAuth login
      x-requirement-ids: [AUTH-01]
      responses:
        '302':
          description: Redirect to GitHub authorization
          headers:
            Location:
              schema: { type: string, format: uri }
        default:
          $ref: '#/components/responses/UnexpectedError'
  /auth/github/callback:
    get:
      security: []
      tags: [Authentication]
      operationId: completeGitHubLogin
      summary: Complete GitHub OAuth and establish a session
      x-requirement-ids: [AUTH-01, AUTH-02]
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        '302':
          description: Redirect to the app after login or a user-visible OAuth error
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              schema: { type: string }
        default:
          $ref: '#/components/responses/UnexpectedError'
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentAccount
      summary: Get the signed-in account
      x-requirement-ids: [AUTH-01]
      responses:
        '200':
          description: Current account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Authentication]
      operationId: updateCurrentAccount
      summary: Update the current account's editable profile
      x-requirement-ids: [AUTH-03]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountProfileUpdate' }
      responses:
        '200':
          description: Updated current account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: End the current account session
      x-requirement-ids: [AUTH-01]
      responses:
        '204': { description: Session ended }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /model-config:
    get:
      tags: [ModelSettings]
      operationId: getModelConfig
      summary: Read the current account's model settings without secrets
      x-requirement-ids: [MODEL-01, MODEL-02, MODEL-03]
      responses:
        '200':
          description: Configured models and integration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConfig'
        default:
          $ref: '#/components/responses/UnexpectedError'
    put:
      tags: [ModelSettings]
      operationId: updateModelConfig
      summary: Update the current account's model settings
      x-requirement-ids: [MODEL-01, MODEL-02, MODEL-03]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelConfigUpdate' }
      responses:
        '200':
          description: Updated settings without secret values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConfig' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /model-config/test:
    post:
      tags: [ModelSettings]
      operationId: testTextModelConnection
      summary: Test the configured text model connection
      x-requirement-ids: [MODEL-01]
      responses:
        '200':
          description: Connection test result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelConnectionTest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /assets/{asset_id}:
    parameters:
      - name: asset_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Generations]
      operationId: getImageAsset
      summary: Read a generated image from private persistent storage
      x-requirement-ids: [MODEL-02, GEN-02]
      responses:
        '200':
          description: Generated image bytes
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project
      x-requirement-ids: [PROJ-01]
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Update project details
      x-requirement-ids: [PROJ-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project and its project-owned records
      x-requirement-ids: [PROJ-03]
      responses:
        '204':
          description: Project deleted
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /projects/{project_id}/episodes:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Episodes]
      operationId: listEpisodes
      summary: List episodes in a project
      x-requirement-ids: [STORY-01]
      responses:
        '200':
          description: Episodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Episode'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [Episodes]
      operationId: createEpisode
      summary: Create an episode or story segment
      x-requirement-ids: [STORY-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpisodeCreate'
      responses:
        '201':
          description: Episode created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Episode'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /episodes/{episode_id}:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    patch:
      tags: [Episodes]
      operationId: updateEpisode
      summary: Update a story unit
      x-requirement-ids: [STORY-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpisodePatch'
      responses:
        '200':
          description: Updated story unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Episode'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /projects/{project_id}/scenes:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Scenes]
      operationId: listScenes
      summary: List scene assets
      x-requirement-ids: [ASSET-02]
      responses:
        '200':
          description: Scene assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scene'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /scenes/{scene_id}:
    parameters:
      - name: scene_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Scenes]
      operationId: updateScene
      summary: Edit or approve a scene profile
      x-requirement-ids: [ASSET-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenePatch'
      responses:
        '200':
          description: Updated scene
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /projects/{project_id}/scene-generations:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Scenes, Generations]
      operationId: generateScenes
      summary: Generate scene profile drafts from the project story
      x-requirement-ids: [ASSET-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneGenerationRequest'
      responses:
        '202':
          description: Generation task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationTask'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /projects/{project_id}/characters:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Characters]
      operationId: listCharacters
      summary: List character assets
      x-requirement-ids: [ASSET-01]
      responses:
        '200':
          description: Character assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Character'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /characters/{character_id}:
    parameters:
      - name: character_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Characters]
      operationId: updateCharacter
      summary: Edit or approve a character profile
      x-requirement-ids: [ASSET-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterPatch'
      responses:
        '200':
          description: Updated character
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /projects/{project_id}/character-generations:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Characters, Generations]
      operationId: generateCharacters
      summary: Generate character profile drafts from the project story
      x-requirement-ids: [ASSET-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterGenerationRequest'
      responses:
        '202':
          description: Generation task accepted
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              description: URL of the generation task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationTask'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /projects/{project_id}/storyboard-generations:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Storyboards, Generations]
      operationId: generateStoryboard
      summary: Generate storyboard drafts for an episode
      x-requirement-ids: [SB-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryboardGenerationRequest'
      responses:
        '202':
          description: Generation task accepted
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              description: URL of the generation task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationTask'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /episodes/{episode_id}/panels:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    get:
      tags: [Storyboards]
      operationId: listPanels
      summary: List storyboard panels
      x-requirement-ids: [SB-01]
      responses:
        '200':
          description: Ordered storyboard panels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoryboardPanel'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [Storyboards]
      operationId: createPanel
      summary: Add a storyboard panel
      x-requirement-ids: [SB-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryboardPanelCreate'
      responses:
        '201':
          description: Created storyboard panel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryboardPanel'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /episodes/{episode_id}/panels/order:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    put:
      tags: [Storyboards]
      operationId: reorderPanels
      summary: Replace the ordered storyboard panel IDs
      x-requirement-ids: [SB-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PanelOrder'
      responses:
        '200':
          description: Updated ordered storyboard panels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoryboardPanel'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /panels/{panel_id}:
    parameters:
      - $ref: '#/components/parameters/PanelId'
    patch:
      tags: [Storyboards]
      operationId: updatePanel
      summary: Edit storyboard panel content or order
      x-requirement-ids: [SB-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryboardPanelPatch'
      responses:
        '200':
          description: Updated panel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryboardPanel'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      tags: [Storyboards]
      operationId: deletePanel
      summary: Delete a storyboard panel
      x-requirement-ids: [SB-03]
      responses:
        '204':
          description: Panel deleted
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /panels/{panel_id}/image-versions:
    parameters:
      - $ref: '#/components/parameters/PanelId'
    get:
      tags: [Generations]
      operationId: listPanelImageVersions
      summary: List generated image versions for a panel
      x-requirement-ids: [GEN-01, GEN-04]
      responses:
        '200':
          description: Image versions ordered newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PanelImageVersion'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /panels/{panel_id}/image-versions/{version_id}/selection:
    parameters:
      - $ref: '#/components/parameters/PanelId'
      - name: version_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Generations]
      operationId: selectPanelImageVersion
      summary: Select the current image version for a panel
      x-requirement-ids: [GEN-04]
      responses:
        '200':
          description: Selected image version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanelImageVersion'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /panels/{panel_id}/image-generations:
    parameters:
      - $ref: '#/components/parameters/PanelId'
    post:
      tags: [Storyboards, Generations]
      operationId: generatePanelImage
      summary: Generate a new image version for one panel
      x-requirement-ids: [GEN-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PanelImageGenerationRequest'
      responses:
        '202':
          description: Image generation task accepted
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              description: URL of the generation task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationTask'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /generation-tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Generations]
      operationId: getGenerationTask
      summary: Get task state and result
      x-requirement-ids: [GEN-02]
      responses:
        '200':
          description: Generation task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationTask'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /generation-tasks/{task_id}/retries:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Generations]
      operationId: retryGenerationTask
      summary: Retry a failed generation as a new task
      x-requirement-ids: [GEN-03]
      responses:
        '202':
          description: Retry task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationTask'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /episodes/{episode_id}/exports:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
    post:
      tags: [Exports, Generations]
      operationId: createEpisodeExport
      summary: Create an export for the current episode state
      x-requirement-ids: [EXP-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '202':
          description: Export task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationTask'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /exports/{asset_id}:
    parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Exports]
      operationId: downloadExport
      summary: Download a completed export
      x-requirement-ids: [EXP-01]
      responses:
        '200':
          description: Export file
          content:
            application/json:
              schema:
                type: object
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: manxu_session
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EpisodeId:
      name: episode_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PanelId:
      name: panel_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Unauthorized:
      description: Authentication is required
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Operation conflicts with the current resource state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    UnexpectedError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
