[project]
name = "manxu-api"
version = "0.1.0"
description = "FastAPI backend for Manxu Studio"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.17.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "fastapi[standard]>=0.120.0,<1.0.0",
    "pydantic-settings>=2.11.0,<3.0.0",
    "pillow>=11.3.0,<13.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "sqlalchemy[asyncio]>=2.0.44,<3.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "mypy>=1.18.2,<2.0.0",
    "pytest>=8.4.2,<9.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "ruff>=0.14.0,<1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
