x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+asyncpg://manxu:manxu@postgres:5432/manxu_dev
  REDIS_URL: redis://redis:6379/0
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  SMTP_FROM: ${SMTP_FROM:-noreply@manxu.local}
  IMAGE_STORAGE_DIR: /app/var/images
  OBJECT_STORE_BACKEND: ${OBJECT_STORE_BACKEND:-local}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-ap-guangzhou}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-virtual}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: manxu_dev
      POSTGRES_USER: manxu
      POSTGRES_PASSWORD: manxu
    ports:
      - "${POSTGRES_PORT:-55442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manxu -d manxu_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    # Local/dev only. Production overlay omits profile "local", so Mailpit does not start
    # and Compose ignores this dependency on api.
    profiles: ["local"]
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - image-data:/app/var/images
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    command: ["sh", "-c", "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    volumes:
      - image-data:/app/var/images
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ARQ worker has no HTTP port; do not inherit an API image HEALTHCHECK.
    healthcheck:
      disable: true
    command: ["uv", "run", "arq", "app.worker.WorkerSettings"]
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  postgres-data:
  redis-data:
  image-data:
