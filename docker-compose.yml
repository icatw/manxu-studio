services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: manxu_dev
      POSTGRES_USER: manxu
      POSTGRES_PASSWORD: manxu
    ports:
      - "55442:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manxu -d manxu_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    ports:
      - "56379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://manxu:manxu@postgres:5432/manxu_dev
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_STARTTLS: "false"
      SMTP_FROM: ${SMTP_FROM:-noreply@manxu.local}
      IMAGE_STORAGE_DIR: /app/var/images
    ports:
      - "8000:8000"
    volumes:
      - image-data:/app/var/images
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    command: ["sh", "-c", "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://manxu:manxu@postgres:5432/manxu_dev
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_STARTTLS: "false"
      SMTP_FROM: ${SMTP_FROM:-noreply@manxu.local}
      IMAGE_STORAGE_DIR: /app/var/images
    volumes:
      - image-data:/app/var/images
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uv", "run", "arq", "app.worker.WorkerSettings"]

volumes:
  postgres-data:
  redis-data:
  image-data:
