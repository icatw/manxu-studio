# Isolated playground stack — does not share volumes with docker-compose.yml (manxu_dev).
# Usage:
#   docker compose -p manxu-playground -f docker-compose.playground.yml up -d --build --wait
#   make playground-up

name: manxu-playground

x-playground-backend-env: &playground-backend-env
  APP_ENV: development
  DATABASE_URL: postgresql+asyncpg://manxu:manxu@postgres:5432/manxu_playground
  REDIS_URL: redis://redis:6379/1
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_STARTTLS: "false"
  SMTP_FROM: noreply@manxu.dev
  IMAGE_STORAGE_DIR: /app/var/images
  MODEL_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  EMAIL_CODE_PEPPER: playground-email-pepper
  CORS_ORIGINS: http://localhost:15174
  ALLOW_PRIVATE_MODEL_BASE_URLS: "true"
  PLATFORM_AGNES_API_KEY: playground-platform-key
  PLATFORM_AGNES_TEXT_BASE_URL: http://fake-llm:8080/v1
  PLATFORM_AGNES_IMAGE_BASE_URL: http://fake-llm:8080/v1
  PLATFORM_AGNES_TEXT_MODEL: fake-text
  PLATFORM_AGNES_IMAGE_MODEL: agnes-image-2.5-flash
  PLATFORM_QUOTA_TEXT_PER_DAY: "200"
  PLATFORM_QUOTA_IMAGE_PER_DAY: "100"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: manxu_playground
      POSTGRES_USER: manxu
      POSTGRES_PASSWORD: manxu
    ports:
      - "${PLAYGROUND_POSTGRES_PORT:-55443}:5432"
    volumes:
      - playground-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manxu -d manxu_playground"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    ports:
      - "${PLAYGROUND_REDIS_PORT:-56380}:6379"
    volumes:
      - playground-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${PLAYGROUND_MAILPIT_PORT:-8026}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

  fake-llm:
    build:
      context: ./playground/fake_llm
    ports:
      - "${PLAYGROUND_FAKE_LLM_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./backend
    environment: *playground-backend-env
    ports:
      - "${PLAYGROUND_API_PORT:-8001}:8000"
    volumes:
      - playground-image-data:/app/var/images
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      fake-llm:
        condition: service_healthy
    command: ["sh", "-c", "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 18

  worker:
    build:
      context: ./backend
    environment: *playground-backend-env
    volumes:
      - playground-image-data:/app/var/images
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      fake-llm:
        condition: service_healthy
    command: ["uv", "run", "arq", "app.worker.WorkerSettings"]

  frontend:
    build:
      context: ./frontend
    ports:
      - "${PLAYGROUND_FRONTEND_PORT:-15174}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  playground-postgres-data:
  playground-redis-data:
  playground-image-data:
